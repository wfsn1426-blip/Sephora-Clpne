
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>BEAUTY | Your Beauty Destination</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- شريط الإعلان -->
  <div class="announcement-bar">
    <strong>اكتشفي عالم الجمال مع BEAUTY</strong>
    <span>اختيارات مميزة من المكياج والعطور والعناية — تسوّقي الآن</span>
  </div>

  <!-- الشريط الرئيسي -->
  <header class="main-header">

    <div class="header-icons">
      <a href="#cart" aria-label="السلة" class="header-icon">♧</a>
      <a href="#favorites" aria-label="المفضلة" class="header-icon">♡</a>
      <a href="#account" aria-label="حسابي" class="header-icon">♙</a>
    </div>

    <div class="search-box">
      <input type="search" placeholder="بحث عن المنتجات...">
      <button type="button" aria-label="بحث">⌕</button>
    </div>

    <a href="#home" class="brand-logo">BEAUTY<span>.</span></a>

  </header>

  <!-- قائمة الأقسام -->
  <nav class="main-navigation">
    <a href="#new">وصل حديثًا</a>
    <a href="#offers">عروض الجمال</a>
    <a href="#makeup">المكياج</a>
    <a href="#fragrance">العطور</a>
    <a href="#skincare">العناية بالبشرة</a>
    <a href="#brands">الماركات</a>
    <a href="#undertone">اكتشفي الاندرتون</a>
  </nav>

  <!-- شريط المزايا -->
  <section class="welcome-strip">
    <div class="welcome-message">
      <strong>انضمي إلى عالم BEAUTY!</strong>
      <p>استمتعي بتجربة تسوق مميزة واكتشفي اختيارات تناسب جمالك.</p>
    </div>

    <a href="#account" class="login-button">
      تسجيل الدخول / إنشاء حساب
    </a>
  </section>

  <!-- البانر الرئيسي: صورتك الأصلية -->
  <main>
    <section class="hero-banner" id="home">
      <img
        src="assets/beauty-hero.png"
        alt="حملة BEAUTY للجمال والمكياج"
      >
    </section>
  </main>

</body>
</html>
